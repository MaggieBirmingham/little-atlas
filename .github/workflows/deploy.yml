name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require a committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error title=package-lock.json is missing::npm ci needs a committed lockfile. Run 'npm install' locally and commit package-lock.json, or run the 'Generate lockfile' workflow once."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set these as Actions secrets in the repo (Settings -> Secrets and
          # variables -> Actions). Only the PUBLIC anon key belongs here —
          # see README "Manual setup" for exactly what to configure and why
          # this is safe to ship in the built assets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
