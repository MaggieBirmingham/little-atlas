name: Generate lockfile

# One-off helper. package-lock.json has to be produced by npm against the real
# registry (it records integrity hashes), so it can't be written by hand.
# Run this once from the Actions tab (or just run `npm install` locally and
# commit the result). It commits package-lock.json to the branch it runs on.
# If that branch is protected, run `npm install` locally instead.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit it
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json"
          git push
