name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require a committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error title=package-lock.json is missing::npm ci needs a committed lockfile. Run 'npm install' locally and commit package-lock.json, or run the 'Generate lockfile' workflow once."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --coverage=false

      - name: Build
        run: npm run build
        env:
          # A placeholder is enough for the production build to succeed —
          # real values are injected at deploy time by the deploy workflow's
          # own secrets. The build itself doesn't talk to Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test (guest mode)
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
